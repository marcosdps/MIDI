<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compositor MIDI con IA</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --texto: #1f1f1d; --suave: #6b6a65; --borde: #dcdad2;
    --acento: #3b5bdb; --acento-texto: #ffffff; --ok: #1f7a3d; --error: #c92a2a; --error-bg: #fdecec;
    --burbuja-user: #e7ecfd; --burbuja-ia: #f0eee8; --codigo-bg: #fbfaf7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1d; --texto: #ecebe6; --suave: #9b9a93; --borde: #3a3935;
      --acento: #6d8bff; --acento-texto: #111; --ok: #51cf66; --error: #ff8787; --error-bg: #3a2222;
      --burbuja-user: #26304f; --burbuja-ia: #2b2a27; --codigo-bg: #1a1918;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--texto);
         display: flex; flex-direction: column; }
  header { padding: 10px 18px; border-bottom: 1px solid var(--borde); background: var(--panel);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--suave); font-size: 13px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 4fr) minmax(360px, 6fr); gap: 12px; padding: 12px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-auto-rows: minmax(420px, auto); overflow: auto; } }
  section { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  .titulo { padding: 9px 12px; border-bottom: 1px solid var(--borde); display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .titulo .espacio { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--borde); background: var(--panel);
           color: var(--texto); padding: 6px 12px; }
  button:hover:not(:disabled) { border-color: var(--acento); }
  button.primario { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }

  /* chat */
  #mensajes { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--burbuja-user); }
  .msg.ia { align-self: flex-start; background: var(--burbuja-ia); }
  .msg.nota { align-self: center; color: var(--suave); font-size: 13px; background: none; padding: 2px; }
  .msg.fallo { align-self: stretch; background: var(--error-bg); color: var(--error); }
  #sugerencias { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  #sugerencias button { font-size: 13px; padding: 4px 9px; color: var(--suave); }
  #entrada { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--borde); }
  #texto { flex: 1; resize: none; font: inherit; padding: 8px; border-radius: 7px; border: 1px solid var(--borde);
           background: var(--panel); color: var(--texto); height: 62px; }

  /* editor */
  #editorWrap { flex: 1; min-height: 160px; display: flex; background: var(--codigo-bg); overflow: hidden; }
  #gutter, #editor { font: 13px/20px ui-monospace, Menlo, Consolas, monospace; padding: 8px 0; margin: 0; }
  #gutter { width: 44px; text-align: right; color: var(--suave); overflow: hidden; user-select: none;
            border-right: 1px solid var(--borde); flex: none; }
  #gutter div { padding-right: 8px; height: 20px; }
  #gutter div.err { background: var(--error-bg); color: var(--error); font-weight: 700; }
  #editor { flex: 1; border: 0; outline: 0; resize: none; padding-left: 10px; background: transparent; color: var(--texto);
            white-space: pre; overflow: auto; tab-size: 2; }

  /* resultado */
  #resultado { border-top: 1px solid var(--borde); padding: 10px 12px; max-height: 42%; overflow-y: auto; }
  #resultado:empty { display: none; }
  .ok { color: var(--ok); font-weight: 600; }
  .listaErrores { list-style: none; margin: 6px 0; padding: 0; }
  .listaErrores li { padding: 5px 8px; margin-bottom: 4px; border-radius: 6px; background: var(--error-bg); color: var(--error); cursor: pointer; }
  .listaErrores b { font-weight: 700; }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  a.boton { text-decoration: none; display: inline-block; }
  details { margin-top: 8px; color: var(--suave); font-size: 13px; }
  table { border-collapse: collapse; margin-top: 6px; }
  td, th { border: 1px solid var(--borde); padding: 2px 8px; text-align: left; }
  midi-player { display: block; width: 100%; margin-top: 8px; }
  midi-visualizer { display: block; margin-top: 6px; overflow-x: auto; }
</style>
</head>
<body>
<header><h1>Compositor MIDI con IA</h1><span>Pedí una canción a la IA, revisá el código y compilala a .mid</span></header>
<main>
  <section>
    <div class="titulo">Chat con la IA</div>
    <div id="mensajes">
      <div class="msg ia">Contame qué canción querés: ánimo, acordes, instrumentos, tempo... y la escribo en el panel de la derecha.</div>
    </div>
    <div id="sugerencias"></div>
    <div id="entrada">
      <textarea id="texto" placeholder="Ej: una canción triste en La menor con piano y violín, usando Am, F, C y G"></textarea>
      <button id="enviar" class="primario">Enviar</button>
    </div>
  </section>

  <section>
    <div class="titulo">
      cancion.txt
      <span class="espacio"></span>
      <button id="descargarTxt" title="Descargar el texto de la canción">Descargar .txt</button>
      <button id="componer" class="primario">Componer</button>
    </div>
    <div id="editorWrap">
      <div id="gutter"></div>
      <textarea id="editor" spellcheck="false" wrap="off" placeholder="Acá aparece la canción. También podés escribirla o editarla a mano."></textarea>
    </div>
    <div id="resultado"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const historial = [];        // lo que se le manda a Claude: {rol, contenido}
let ultimaDeIA = "";         // ultima cancion escrita por Claude (para detectar ediciones manuales)
let urlMidi = null;

// ---------- editor con numeros de linea ----------
function pintarGutter(lineasError = []) {
  const n = Math.max(1, $("editor").value.split("\n").length);
  const err = new Set(lineasError);
  $("gutter").innerHTML = Array.from({ length: n }, (_, i) =>
    `<div${err.has(i + 1) ? ' class="err"' : ''}>${i + 1}</div>`).join("");
  $("gutter").scrollTop = $("editor").scrollTop;
}
$("editor").addEventListener("input", () => pintarGutter());
$("editor").addEventListener("scroll", () => { $("gutter").scrollTop = $("editor").scrollTop; });
function irALinea(linea) {
  const lineas = $("editor").value.split("\n");
  const l = Math.min(Math.max(linea, 1), lineas.length);
  const ini = lineas.slice(0, l - 1).reduce((a, s) => a + s.length + 1, 0);
  $("editor").focus();
  $("editor").setSelectionRange(ini, ini + lineas[l - 1].length);
  $("editor").scrollTop = Math.max(0, (l - 4) * 20);
}

// ---------- chat ----------
function burbuja(clase, texto) {
  const d = document.createElement("div");
  d.className = "msg " + clase; d.textContent = texto;
  $("mensajes").appendChild(d); $("mensajes").scrollTop = 1e9;
  return d;
}
function bloqueado(b) { ["enviar", "componer", "texto"].forEach(id => $(id).disabled = b); }

async function enviar(mostrado, contenido) {
  if (!mostrado.trim()) return;
  burbuja("user", mostrado);
  historial.push({ rol: "user", contenido });
  bloqueado(true);
  const espera = burbuja("nota", "La IA está componiendo…");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ mensajes: historial }) });
    const d = await r.json();
    espera.remove();
    if (!r.ok) throw new Error(d.error || "Error " + r.status);

    historial.push({ rol: "assistant", contenido: d.texto });
    if (d.mensaje) burbuja("ia", d.mensaje);
    if (d.correcciones > 0)
      burbuja("nota", `La IA corrigió su propia canción ${d.correcciones} ${d.correcciones === 1 ? "vez" : "veces"} antes de mostrártela.`);
    if (d.cancion) {
      ultimaDeIA = d.cancion;
      $("editor").value = d.cancion;
      limpiarResultado();
      if (d.errores.length) {
        burbuja("nota", "La canción todavía tiene errores; podés corregirlos a mano o pedirle a la IA que lo intente de nuevo.");
        mostrarErrores(d.errores);
      } else {
        burbuja("nota", "La canción compila sin errores. Presioná Componer para generar el .mid.");
        pintarGutter();
      }
    }
  } catch (e) {
    espera.remove();
    historial.pop();                      // el mensaje no se procesó: no queda en el historial
    burbuja("fallo", "No se pudo completar el pedido: " + e.message);
  } finally {
    bloqueado(false);
  }
}

// Si el usuario edito la cancion a mano, la IA tiene que ver la version actual
function conCancionActual(texto) {
  const actual = $("editor").value.trim();
  if (actual && actual !== ultimaDeIA.trim())
    return "(La canción actual del panel, editada por mí:)\n```cancion\n" + actual + "\n```\n\n" + texto;
  return texto;
}
function pedido() {
  const t = $("texto").value.trim();
  if (!t) return;
  $("texto").value = "";
  enviar(t, conCancionActual(t));
}
$("enviar").onclick = pedido;
$("texto").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); pedido(); } });

["Una canción triste en La menor con piano y violín, usando Am, F, C y G",
 "Algo alegre y bailable con guitarra, bajo y batería",
 "Una melodía misteriosa con flauta y silencios"].forEach(t => {
  const b = document.createElement("button"); b.textContent = t;
  b.onclick = () => { $("texto").value = t; $("texto").focus(); };
  $("sugerencias").appendChild(b);
});

// ---------- compilar ----------
function limpiarResultado() {
  $("resultado").innerHTML = "";
  if (urlMidi) { URL.revokeObjectURL(urlMidi); urlMidi = null; }
  pintarGutter();
}

function mostrarErrores(errores) {
  const cont = $("resultado"); cont.innerHTML = "";
  const t = document.createElement("div");
  t.innerHTML = `<b style="color:var(--error)">${errores.length} ${errores.length === 1 ? "error" : "errores"}</b> — no se generó el .mid. Tocá un error para ir a su línea.`;
  cont.appendChild(t);
  const ul = document.createElement("ul"); ul.className = "listaErrores";
  errores.forEach(e => {
    const li = document.createElement("li");
    li.innerHTML = `<b>Línea ${e.linea}, col ${e.columna}</b> (${e.tipo}): `;
    li.append(document.createTextNode(e.mensaje));
    li.onclick = () => irALinea(e.linea);
    ul.appendChild(li);
  });
  cont.appendChild(ul);

  const acc = document.createElement("div"); acc.className = "acciones";
  const b = document.createElement("button"); b.className = "primario"; b.textContent = "Pedirle a la IA que lo corrija";
  b.onclick = () => {
    const lista = errores.slice(0, 15).map(e => `- línea ${e.linea}, columna ${e.columna} (${e.tipo}): ${e.mensaje}`).join("\n");
    enviar("Corregí los errores del compilador en la canción del panel.",
           "El compilador rechazó la canción actual del panel con estos errores:\n" + lista +
           "\n\nCanción actual:\n```cancion\n" + $("editor").value.trim() + "\n```\n\nCorregila y devolvé la canción completa.");
  };
  acc.appendChild(b); cont.appendChild(acc);
  pintarGutter(errores.map(e => e.linea));
}

function mostrarExito(d) {
  const bytes = Uint8Array.from(atob(d.midi), c => c.charCodeAt(0));
  urlMidi = URL.createObjectURL(new Blob([bytes], { type: "audio/midi" }));

  const cont = $("resultado"); cont.innerHTML = "";
  cont.innerHTML = `<div class="ok">✓ Compilado sin errores — ${d.pistas} ${d.pistas === 1 ? "pista" : "pistas"}, ${bytes.length} bytes</div>`;

  const acc = document.createElement("div"); acc.className = "acciones";
  const a = document.createElement("a"); a.className = "boton"; a.href = urlMidi; a.download = "salida.mid";
  const bt = document.createElement("button"); bt.className = "primario"; bt.textContent = "Descargar salida.mid";
  a.appendChild(bt); acc.appendChild(a);
  const ayuda = document.createElement("span"); ayuda.style.color = "var(--suave)";
  ayuda.textContent = "Abrilo en Ableton, MuseScore, onlinesequencer.net, etc.";
  acc.appendChild(ayuda); cont.appendChild(acc);

  if (customElements.get("midi-player")) {       // reproductor opcional (necesita internet para el soundfont)
    const p = document.createElement("midi-player");
    p.setAttribute("sound-font", ""); p.setAttribute("visualizer", "#visor"); p.src = urlMidi;
    const v = document.createElement("midi-visualizer"); v.id = "visor"; v.setAttribute("type", "piano-roll");
    cont.appendChild(p); cont.appendChild(v);
  }

  const det = document.createElement("details");
  det.innerHTML = "<summary>Tabla de símbolos</summary>";
  const tb = document.createElement("table");
  tb.innerHTML = "<tr><th>Nombre</th><th>Tipo</th><th>Línea</th><th>Valor</th></tr>";
  d.simbolos.forEach(s => {
    const tr = tb.insertRow();
    [s.nombre, s.tipo, s.linea, s.valor].forEach(x => { tr.insertCell().textContent = x; });
  });
  det.appendChild(tb); cont.appendChild(det);
  pintarGutter();
}

$("componer").onclick = async () => {
  limpiarResultado();
  bloqueado(true);
  try {
    const r = await fetch("/api/componer", { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ cancion: $("editor").value }) });
    const d = await r.json();
    if (d.ok) mostrarExito(d); else mostrarErrores(d.errores);
  } catch (e) {
    $("resultado").textContent = "No se pudo conectar con el servidor: " + e.message;
  } finally { bloqueado(false); }
};

$("descargarTxt").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("editor").value], { type: "text/plain" }));
  a.download = "cancion.txt"; a.click(); URL.revokeObjectURL(a.href);
};

pintarGutter();
</script>
<!-- Reproductor MIDI en el navegador (opcional; si no hay internet se usa solo la descarga) -->
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
</body>
</html>
